# SURNA on Railway — https://docs.railway.com/reference/config-as-code
# Connect repo: Railway dashboard → New Project → Deploy from GitHub → maliknnia/surna

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/ping"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[env]
NODE_ENV = "production"
