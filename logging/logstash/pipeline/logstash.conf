# Logstash configuration for SURNA log processing
input {
  # Application logs from files
  file {
    path => "/usr/share/logstash/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    tags => ["application"]
  }

  # Nginx access logs
  file {
    path => "/usr/share/logstash/logs/nginx/access.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["nginx", "access"]
  }

  # Nginx error logs
  file {
    path => "/usr/share/logstash/logs/nginx/error.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["nginx", "error"]
  }

  # Docker logs
  beats {
    port => 5044
  }
}

filter {
  # Parse nginx access logs
  if "nginx" in [tags] and "access" in [tags] {
    grok {
      match => { "message" => "%{NGINXACCESS}" }
    }
    
    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
    }
    
    mutate {
      convert => { 
        "response" => "integer"
        "bytes" => "integer"
        "responsetime" => "float"
      }
    }
  }

  # Parse nginx error logs
  if "nginx" in [tags] and "error" in [tags] {
    grok {
      match => { "message" => "%{NGINXERROR}" }
    }
  }

  # Parse application logs
  if "application" in [tags] {
    # Add user ID extraction for authenticated requests
    if [user_id] {
      mutate {
        add_field => { "user_context" => "%{user_id}" }
      }
    }

    # Categorize log levels
    if [level] == "error" {
      mutate {
        add_tag => ["error"]
      }
    } else if [level] == "warn" {
      mutate {
        add_tag => ["warning"]
      }
    }

    # Extract performance metrics
    if [response_time] {
      mutate {
        convert => { "response_time" => "float" }
      }
    }
  }

  # Add geo information for IP addresses
  if [clientip] {
    geoip {
      source => "clientip"
      target => "geoip"
      add_tag => [ "geoip" ]
    }
  }

  # Remove unnecessary fields
  mutate {
    remove_field => [ "host", "@version" ]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "surna-logs-%{+YYYY.MM.dd}"
    
    # Use document templates for better mapping
    template_name => "surna"
    template_pattern => "surna-*"
    template => "/usr/share/logstash/templates/surna-template.json"
  }

  # Debug output (remove in production)
  stdout { 
    codec => rubydebug 
  }
}